name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV
      - run: make
      - run: make test
      - run: make prototest
      - run: make leaks
